[btest]
TestDirs    = php-rce
# Local disk, not NFS: node log files linger as .nfs* for a few seconds after a
# cluster run exits and make back-to-back runs collide ("directory manager already exists").
TmpDir      = /tmp/btest-php-rce-2026-10-21
BaselineDir = %(testbase)s/Baseline
IgnoreDirs  = .svn CVS .tmp .git
IgnoreFiles = *.tmp *.swp #* *.trace .DS_Store

[environment]
ZEEKBASE=`zeek-config --zeek_dist`
# Package root and scripts/ loadable by bare name (@load <script>) and as $PACKAGE.
ZEEKPATH=`zeek-config --zeekpath`:%(testbase)s/../..:%(testbase)s/..:%(testbase)s/../scripts
# Zeek's testing/scripts on PATH so have-zeromq and the diff-canonifier resolve.
PATH=`zeek-config --zeek_dist`/testing/scripts%(pathsep)s%(default_path)s
ZEEK_SEED_FILE=`zeek-config --zeek_dist`/testing/btest/random.seed
TZ=UTC
LC_ALL=C
TRACES=%(testbase)s/Traces
FILES=`zeek-config --zeek_dist`/testing/btest/Files
DIST=`zeek-config --zeek_dist`
PACKAGE=%(testbase)s/../scripts
TMPDIR=/tmp/btest-php-rce-2026-10-21
TEST_DIFF_CANONIFIER=${ZEEKBASE}/testing/scripts/diff-canonifier
